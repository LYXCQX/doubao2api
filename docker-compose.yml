services:
  doubao2api:
    build: .
    image: doubao2api:latest
    container_name: doubao2api
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - DOUBAO_HOST=0.0.0.0
      - DOUBAO_PORT=9090
      - DOUBAO_HEADLESS=true
      - DOUBAO_AUTO_OPEN=false
      - DOUBAO_BROWSER_DATA=/app/data/doubao_browser
    volumes:
      - doubao_data:/app/data

volumes:
  doubao_data:
    driver: local
